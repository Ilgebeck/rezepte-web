<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lasagne-Variationen</title>
<style>
  :root {
    --bg: #faf6ef;
    --card: #ffffff;
    --ink: #2b2420;
    --muted: #7a6e64;
    --accent: #b5471f;
    --accent-soft: #f6e3d9;
    --line: #e6dccf;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.55;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 64px; }
  .back { font-size: 0.9rem; color: var(--muted); text-decoration: none; }
  .back:hover { color: var(--accent); }
  h1 { font-size: 1.9rem; margin: 10px 0 4px; letter-spacing: -0.01em; }
  .lead { color: var(--muted); margin: 0 0 22px; }

  .group-title {
    font-size: 0.8rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 8px;
  }
  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 12px;
    margin-bottom: 22px;
  }
  .tile {
    text-align: left;
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 14px 12px;
    cursor: pointer;
    font: inherit;
    color: inherit;
    transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  .tile:hover { border-color: #d3b9a5; transform: translateY(-1px); }
  .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .tile[aria-pressed="true"] {
    border-color: var(--accent);
    background: var(--accent-soft);
    box-shadow: 0 2px 10px rgba(181, 71, 31, .18);
  }
  .tile .emoji { font-size: 1.6rem; display: block; margin-bottom: 4px; }
  .tile .t-name { font-weight: 650; display: block; line-height: 1.25; }
  .tile .t-tag { font-size: 0.82rem; color: var(--muted); display: block; margin-top: 4px; }

  .controls {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin: 6px 0 22px;
  }
  .ctl label { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 8px; }
  .ctl output { color: var(--accent); font-weight: 700; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; margin: 0; background: transparent; display: block; }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--line); }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--line); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -8px; border-radius: 50%; background: var(--accent); border: 3px solid var(--card); box-shadow: 0 0 0 1px var(--accent); }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 3px solid var(--card); box-shadow: 0 0 0 1px var(--accent); }
  .scale { position: relative; height: 16px; margin: 2px 11px 0; font-size: 0.75rem; color: var(--muted); }
  .scale span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
  .scale span.edge-r { transform: translateX(-80%); }

  .hint {
    text-align: center; color: var(--muted); padding: 40px 12px;
    border: 2px dashed var(--line); border-radius: var(--radius);
  }
  .recipe { display: none; }
  .recipe.show { display: block; }
  .recipe h2 { font-size: 1.5rem; margin: 0 0 6px; }
  .meta { color: var(--muted); margin: 0 0 18px; }
  .meta span + span::before { content: "·"; margin: 0 8px; }
  .grid { display: grid; grid-template-columns: minmax(240px, 1fr) 1.6fr; gap: 28px; align-items: start; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; gap: 20px; } }
  h3 { font-size: 1.05rem; margin: 0 0 10px; break-after: avoid; page-break-after: avoid; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px;
  }
  .ing { list-style: none; margin: 0; padding: 0; }
  .ing li { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px dotted var(--line); }
  .ing li:last-child { border-bottom: 0; }
  .ing .amt { min-width: 84px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .ing li.head {
    display: block; font-weight: 700; color: var(--accent); padding-top: 12px; border-bottom: 0;
    font-size: .85rem; text-transform: uppercase; letter-spacing: .04em;
    break-after: avoid; page-break-after: avoid;
  }
  .ing li.head:first-child { padding-top: 0; }
  .opt { color: var(--muted); font-size: .85rem; }
  ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; }
  ol.steps li {
    counter-increment: s; position: relative; padding: 0 0 14px 40px;
    break-inside: avoid; page-break-inside: avoid;
  }
  ol.steps li::before {
    content: counter(s); position: absolute; left: 0; top: 0;
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent); color: #fff; font-weight: 700; font-size: .85rem;
    display: flex; align-items: center; justify-content: center;
  }
  .tip {
    margin-top: 8px; padding: 12px 14px; background: var(--accent-soft);
    border-left: 4px solid var(--accent); border-radius: 8px;
  }
  .tip strong { color: var(--accent); }

  @media print {
    body { background: #fff; }
    .tiles, .group-title, .controls, .back, .hint { display: none !important; }
    .panel { border: 0; padding: 0; }
  }
</style>
</head>

<div class="wrap">

  <h1>Lasagne-Variationen</h1>

  <div class="controls">
    <div class="ctl">
      <label for="persons">Personen <output id="personsOut">4</output></label>

</div>

  const tilesWrap = document.getElementById("tilesWrap");
  const recipeEl = document.getElementById("recipe");
  const hintEl = document.getElementById("hint");
  const persons = document.getElementById("persons");
  const personsOut = document.getElementById("personsOut");
  let current = null;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  function fmtNum(v, unit, whole) {
    if (whole) return String(Math.max(1, Math.round(v)));
    if (unit === "g" || unit === "ml") {
      const step = v >= 200 ? 10 : 5;
      return String(Math.max(step, Math.round(v / step) * step));
    }
    const r = Math.max(0.5, Math.round(v * 2) / 2);
    const w = Math.floor(r);
    const half = r - w === 0.5;
    return (w > 0 ? String(w) : "") + (half ? "½" : "");
  }

  function unitLabel(u, t) {
    const plural = !(t === "1" || t === "½");
    switch (u) {
      case "Zehe": return plural ? "Zehen" : "Zehe";
      case "Zweig": return plural ? "Zweige" : "Zweig";
      case "Stange": return plural ? "Stangen" : "Stange";
      default: return u;
    }
  }

  function renderTiles() {
    tilesWrap.innerHTML = GROUPS.map(g =>
      '<h2 class="group-title">' + esc(g.title) + '</h2><div class="tiles" role="group" aria-label="' + esc(g.title) + '">' +
      g.ids.map(id => {
        const r = R.find(x => x.id === id);
        return '<button type="button" class="tile" data-id="' + r.id + '" aria-pressed="false">' +
          '<span class="emoji" aria-hidden="true">' + r.emoji + '</span>' +
          '<span class="t-name">' + esc(r.name) + '</span>' +
          '<span class="t-tag">' + esc(r.tag) + '</span></button>';
      }).join("") + '</div>'
    ).join("");
  }

  function renderRecipe() {
    const r = R.find(x => x.id === current);
    if (!r) { recipeEl.classList.remove("show"); hintEl.style.display = ""; return; }
    hintEl.style.display = "none";
    const p = parseInt(persons.value, 10);
    const k = p / 4;
    const forms = Math.max(1, Math.ceil(p / 4));
    const formText = p <= 2 ? "Form ca. 18 × 18 cm" : (forms === 1 ? "Form ca. 20 × 25 cm" : forms + " Formen ca. 20 × 25 cm");

    const ingHtml = r.ing.map(i => {
      if (i.h) return '<li class="head">' + esc(i.h) + '</li>';
      let amt;
      if (i.t) {
        amt = i.t;
      } else {
        const t = fmtNum(i.a * k, i.u, i.int);
        amt = t + " " + unitLabel(i.u, t);
      }
      return '<li><span class="amt">' + esc(amt) + '</span><span>' +
        esc(i.n) + (i.opt ? ' <span class="opt">(optional)</span>' : '') + '</span></li>';
    }).join("");

    const stepsHtml = r.steps.map(s => "<li>" + esc(s) + "</li>").join("");
    const note = p > 4
      ? '<div class="tip"><strong>Bei ' + p + ' Personen:</strong> Die Mengen gelten für ' + forms + (forms === 1 ? ' Form' : ' Formen') +
        '. Mit mehreren Formen alle gleichzeitig auf zwei Ebenen backen und die Formen nach der Hälfte der Zeit tauschen. Das Ragù oder die Füllung in einem grossen Topf zubereiten.</div>'
      : (p <= 2 ? '<div class="tip"><strong>Bei 2 Personen:</strong> Eine kleinere Form verwenden. Die Backzeit bleibt gleich, bei sehr flacher Schichtung 5 Minuten kürzer prüfen.</div>' : "");

    recipeEl.innerHTML =
      '<h2>' + r.emoji + " " + esc(r.name) + '</h2>' +
      '<p class="meta"><span>' + p + ' Personen</span><span>' + esc(formText) + '</span><span>' + esc(r.time) + '</span></p>' +
      '<p>' + esc(r.intro) + '</p>' +
      '<div class="grid">' +
        '<section class="panel"><h3>Zutaten</h3><ul class="ing">' + ingHtml + '</ul></section>' +
        '<section class="panel"><h3>Zubereitung</h3><ol class="steps">' + stepsHtml + '</ol>' +
          (r.tip ? '<div class="tip"><strong>Tipp:</strong> ' + esc(r.tip) + '</div>' : "") +
          note +
        '</section>' +
      '</div>';
    recipeEl.classList.add("show");
  }

  function select(id, updateHash) {
    current = id;
    tilesWrap.querySelectorAll(".tile").forEach(t =>
      t.setAttribute("aria-pressed", t.dataset.id === id ? "true" : "false"));
    renderRecipe();
    if (updateHash && history.replaceState) history.replaceState(null, "", "#" + id);
  }

  tilesWrap.addEventListener("click", e => {
    const t = e.target.closest(".tile");
    if (!t) return;
    select(t.dataset.id, true);
    recipeEl.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  persons.addEventListener("input", () => { personsOut.textContent = persons.value; renderRecipe(); });

  renderTiles();
  const fromHash = location.hash.replace("#", "");
  if (R.some(r => r.id === fromHash)) select(fromHash, false);
})();
</script>
