  .tile .t-name { font-weight: 650; display: block; line-height: 1.25; }
  .tile .t-tag { font-size: 0.82rem; color: var(--muted); display: block; margin-top: 4px; }
  .badge {

    text-transform: uppercase; color: var(--accent); margin-bottom: 4px;
  }

  /* Regler */
  .controls {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    display: grid;

  .recipe { display: none; }

  .meta { color: var(--muted); margin: 0 0 18px; }

  h3 { font-size: 1.05rem; margin: 0 0 10px; break-after: avoid; page-break-after: avoid; }
  .panel {

  .ing { list-style: none; margin: 0; padding: 0; }

  .tip {

    border-left: 4px solid var(--accent); border-radius: 8px;
  }
  .tip strong { color: var(--accent); }

  @media print {
    body { background: #fff; }
    .tiles, .controls, .back, .hint { display: none !important; }
    .panel { border: 0; padding: 0; }
  }

  const personsOut = document.getElementById("personsOut");
  const heat = document.getElementById("heat");
  const heatOut = document.getElementById("heatOut");
  let current = null;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  // Zahlen schön formatieren, Brüche für Halbe
  function fmtNum(v, unit) {
    if (unit === "g" || unit === "ml") {
      const step = v >= 200 ? 10 : 5;
      return String(Math.round(v / step) * step);
    }
    const r = Math.round(v * 2) / 2;
    const whole = Math.floor(r);
    const half = r - whole === 0.5;
    if (r === 0) return "½";
    return (whole > 0 ? String(whole) : "") + (half ? "½" : "");
  }

  function unitLabel(u, amountText) {
    const plural = !(amountText === "1" || amountText === "½");
    switch (u) {
      case "Zehe": return plural ? "Zehen" : "Zehe";
      case "Prise": return plural ? "Prisen" : "Prise";
      case "Zweig": return plural ? "Zweige" : "Zweig";
      case "Handvoll": return plural ? "Handvoll" : "Handvoll";
      case "Stk": return "Stk";
      default: return u;
    }
  }

  function renderTiles() {
    tilesEl.innerHTML = R.map(r =>
      '<button type="button" class="tile" data-id="' + r.id + '" aria-pressed="false">' +
        (r.badge ? '<span class="badge">' + esc(r.badge) + '</span>' : '') +
        '<span class="emoji" aria-hidden="true">' + r.emoji + '</span>' +
        '<span class="t-name">' + esc(r.name) + '</span>' +
        '<span class="t-tag">' + esc(r.tag) + '</span>' +
      '</button>'
    ).join("");
  }

  function renderRecipe() {
    const r = R.find(x => x.id === current);
    if (!r) { recipeEl.classList.remove("show"); hintEl.style.display = ""; return; }
    hintEl.style.display = "none";
    const p = parseInt(persons.value, 10);
    const h = HEAT[parseInt(heat.value, 10)];
    const k = p / 2;

    const ingHtml = r.ing.map(i => {
      if (i.chili) {
        if (h.f === 0) return "";
        const raw = Math.max(1, Math.round(i.a * k * h.f));
        const t = String(raw);
        return '<li><span class="amt">' + t + " " + unitLabel(i.u, t) + '</span><span>' + esc(i.n) + '</span></li>';
      }
      const t = fmtNum(i.a * k, i.u);
      const u = unitLabel(i.u, t);
      return '<li><span class="amt">' + t + " " + esc(u) + '</span><span>' +
        esc(i.n) + (i.opt ? ' <span class="opt">(optional)</span>' : '') + '</span></li>';
    }).join("");

    const stepsHtml = r.steps.map(s => "<li>" + esc(s) + "</li>").join("");
    const potNote = p > 6
      ? '<div class="tip"><strong>Bei ' + p + ' Personen:</strong> Brät in zwei Pfannen oder in Portionen anbraten, sonst dünstet er statt zu bräunen. Für die Pasta einen grossen Topf mit entsprechend mehr Wasser verwenden.</div>'
      : "";

    recipeEl.innerHTML =
      '<h2>' + r.emoji + " " + esc(r.name) + '</h2>' +
      '<p class="meta"><span>' + p + ' Personen</span><span>' + esc(r.time) + '</span>' +
        (h.f === 0 ? "" : '<span>Schärfe: ' + h.label + '</span>') + '</p>' +
      '<p>' + esc(r.intro) + '</p>' +
      '<div class="grid">' +
        '<section class="panel"><h3>Zutaten</h3><ul class="ing">' + ingHtml + '</ul></section>' +
        '<section class="panel"><h3>Zubereitung</h3><ol class="steps">' + stepsHtml + '</ol>' +
          (r.tip ? '<div class="tip"><strong>Tipp:</strong> ' + esc(r.tip) + '</div>' : "") +
          potNote +
        '</section>' +
      '</div>';
    recipeEl.classList.add("show");
  }

  function select(id, updateHash) {
    current = id;
    tilesEl.querySelectorAll(".tile").forEach(t =>
      t.setAttribute("aria-pressed", t.dataset.id === id ? "true" : "false"));
    renderRecipe();
    if (updateHash && history.replaceState) history.replaceState(null, "", "#" + id);
  }

  tilesEl.addEventListener("click", e => {
    const t = e.target.closest(".tile");
    if (!t) return;
    select(t.dataset.id, true);
    recipeEl.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  persons.addEventListener("input", () => { personsOut.textContent = persons.value; renderRecipe(); });
  heat.addEventListener("input", () => { heatOut.textContent = HEAT[heat.value].label; renderRecipe(); });

  renderTiles();
  const fromHash = location.hash.replace("#", "");
  if (R.some(r => r.id === fromHash)) select(fromHash, false);
})();
</script>
</body>
</html>
